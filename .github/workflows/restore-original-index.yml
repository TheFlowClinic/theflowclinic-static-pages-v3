name: Restore original index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-original-index.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact uploaded HTML
        shell: bash
        run: |
          set -euo pipefail
          cat site-data-0.txt site-data-1.txt site-data-2.txt site-data-3.txt > /tmp/site.b64
          base64 -d /tmp/site.b64 | gzip -dc > index.html
          echo 'ffa75a5f8254c03b9f0d17526e03154e66663d0fbcec1444878a2fc8619d01f6  index.html' | sha256sum -c -
          rm site-data-0.txt site-data-1.txt site-data-2.txt site-data-3.txt

      - name: Commit direct page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site-data-0.txt site-data-1.txt site-data-2.txt site-data-3.txt
          git commit -m 'Serve original HTML directly'
          git push origin HEAD:main
